[package]
name = "farabi"
version = "0.2.0"
description = "Farabi desktop shell"
edition = "2021"
publish = false

[lib]
name = "farabi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
getrandom = "0.2"
base64 = "0.22"

[features]
# Test-only WebDriver support for the native smoke suite (research R7).
e2e = []

[profile.release]
lto = true
codegen-units = 1
strip = true
