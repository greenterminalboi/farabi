# Feature 11 (T076): the desktop app's checks. Everything runs on PGlite inside the app, so no
# database service is needed. GPU frame timing is manual (gates.md, G1), and native WebdriverIO
# smoke tests (T032/T040/T071) aren't written yet.
name: desktop

on:
  push:
    branches: [main, v0.2, 011-tauri-desktop-app]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install webkit chromium
      # The packaged server in desktop mode, WebKit (macOS) and Chromium (Windows' WebView2).
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: test-results/ }

  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # Fetches Node, builds the standalone server, refuses stray traced files, bundles, and fails
      # if an installer is 100 MB or more (SC-002).
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
